name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar --exclude='.git' -czf "mac-maintenance-${VERSION}.tar.gz" .
          shasum -a 256 "mac-maintenance-${VERSION}.tar.gz" > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mac-maintenance-*.tar.gz
            SHA256SUMS
