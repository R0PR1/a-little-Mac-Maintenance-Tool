name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: make syntax
      - name: ShellCheck
        run: make lint

  tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Tests
        run: make test

  tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: brew install bats-core
      - name: Syntax
        run: make syntax
      - name: Tests
        run: make test
      - name: Build menu extra
        run: make menubar
