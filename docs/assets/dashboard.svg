<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-labelledby="title desc">
  <title id="title">mm status dashboard</title>
  <desc id="desc">Example output of the mm macOS health dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14201c"/>
      <stop offset="100%" stop-color="#0b1210"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a24"/>
      <stop offset="100%" stop-color="#101a16"/>
    </linearGradient>
  </defs>
  <rect width="880" height="620" rx="28" fill="url(#bg)"/>
  <rect x="36" y="36" width="808" height="548" rx="18" fill="#0e1714" stroke="#2a3d34" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="6" fill="#e07a5f"/>
  <circle cx="84" cy="64" r="6" fill="#f2cc8f"/>
  <circle cx="104" cy="64" r="6" fill="#81b29a"/>
  <text x="128" y="69" fill="#8aa397" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">mm status</text>
  <rect x="48" y="88" width="784" height="472" rx="12" fill="url(#screen)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#d7eee3">
    <text x="72" y="128" fill="#9be7c4" font-weight="700">MM 0.1.0</text>
    <text x="72" y="152" fill="#8aa397">MacBook Pro · macOS 15.6 · arm64</text>
    <text x="72" y="192" fill="#f4f1de" font-weight="700">AUTOMATION</text>
    <text x="72" y="216" fill="#81b29a">&#10003;  Daily check       09:15</text>
    <text x="72" y="240" fill="#6b7c74">&#8722;  Weekly upgrade    disabled</text>
    <text x="72" y="276" fill="#f4f1de" font-weight="700">HOMEBREW</text>
    <text x="72" y="300" fill="#81b29a">&#10003;  Homebrew          healthy</text>
    <text x="72" y="324" fill="#f2cc8f">!  Formulae          3 outdated</text>
    <text x="72" y="348" fill="#81b29a">&#10003;  Casks             up to date</text>
    <text x="72" y="384" fill="#f4f1de" font-weight="700">SYSTEM</text>
    <text x="72" y="408" fill="#81b29a">&#10003;  Disk              54% · 421Gi free</text>
    <text x="72" y="432" fill="#81b29a">&#10003;  Memory            healthy</text>
    <text x="72" y="456" fill="#81b29a">&#10003;  Thermal           normal</text>
    <text x="72" y="480" fill="#81b29a">&#10003;  Battery           94%</text>
    <text x="72" y="504" fill="#81b29a">&#10003;  Time Machine      2h ago</text>
    <text x="72" y="540" fill="#f2cc8f">!  STATUS            ATTENTION</text>
  </g>
</svg>
